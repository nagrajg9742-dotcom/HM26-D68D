<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | CivicTrack</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">
            <h2>CivicTrack</h2>
            <span>Mysuru Civic Services</span>
        </div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="report.html">Report</a>
            <a href="tracking.html">Track</a>
            <a href="complaints.html">My Complaints</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="active">Register</a>
        </nav>
    </header>


    <!-- Register Section -->
    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">
                <h1>Create Account</h1>
                <p>Join CivicTrack and help improve Mysuru</p>
            </div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >
                </div>

                <button type="submit" class="auth-btn">
                    Create Account
                </button>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

            <p id="registerMessage" class="form-message"></p>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 CivicTrack | Mysuru Civic Services</p>
    </footer>


    <script src="../js/register.js"></script>

</body>
</html>
