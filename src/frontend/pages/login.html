 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CivicTrack</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">
            <h2>CivicTrack</h2>
            <span>Mysuru Civic Services</span>
        </div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="report.html">Report</a>
            <a href="tracking.html">Track</a>
            <a href="complaints.html">My Complaints</a>
            <a href="login.html" class="active">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>


    <!-- Login Section -->
    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">
                <h1>Welcome Back 👋</h1>
                <p>Login to continue to CivicTrack</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="auth-btn">
                    Login
                </button>

            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

            <p id="loginMessage" class="form-message"></p>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 CivicTrack | Mysuru Civic Services</p>
    </footer>


    <script src="../js/login.js"></script>

</body>
</html>
