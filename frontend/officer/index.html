<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicTrack - Officer Login</title>

    <link rel="stylesheet" href="css/officer.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <h1>CivicTrack</h1>
            <p>Officer Management Portal</p>

            <form id="loginForm">

                <label for="email">Officer Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your officer email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Login</button>

                <p id="loginMessage"></p>

            </form>

        </div>

    </div>

    <script src="js/officer.js"></script>

</body>
</html>
